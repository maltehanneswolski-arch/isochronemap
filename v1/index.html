<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<title>Isochronic Globe</title>
<style>
:root{
  --ink:#05070E; --ink-2:#080C15; --panel:rgba(9,13,22,.82); --panel-solid:#0B111C;
  --rule:#1C2432; --rule-soft:#151C28;
  --text:#DEE5F1; --text-dim:#95A2B8; --text-faint:#63708A;
  --line:#C9D4E4; --line-lit:#FFFFFF; --line-dim:rgba(190,205,226,.28);
  --hot:#FFFFFF; --glow:rgba(150,170,210,.22);
  --font-d:"Bodoni Moda",Georgia,"Times New Roman",serif;
  --font-s:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
:root{--head:#F2F5FA; --oob:#0A1120; --oob-line:#1C2432}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--text);
  font-family:var(--font-s); font-size:14px; line-height:1.5;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--line-lit);outline-offset:2px}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#sky,#globe{position:absolute;inset:0;width:100%;height:100%;display:block}
#globe{cursor:grab;touch-action:none}
#globe.dragging{cursor:grabbing}

/* ---------- shared panel language ---------- */
.panel{
  position:fixed;z-index:5;background:var(--panel);
  border:1px solid var(--rule);
  backdrop-filter:blur(14px) saturate(115%);
  -webkit-backdrop-filter:blur(14px) saturate(115%);
}
.eyebrow{
  font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--text-faint);font-weight:600;
}

/* ---------- masthead ---------- */
#brand{position:fixed;top:20px;left:24px;z-index:6;max-width:300px;pointer-events:none}
#brand h1{
  font-family:var(--font-d);font-weight:500;font-size:30px;line-height:1;
  margin:0 0 6px;letter-spacing:-.005em;color:var(--head);
  text-shadow:0 1px 3px rgba(0,0,0,.9), 0 2px 22px rgba(0,0,0,.75), 0 0 34px var(--glow);
}
#brand .rule{height:1px;background:linear-gradient(90deg,var(--line-dim),transparent);margin:0 0 8px}
#brand p{margin:0;font-size:11px;line-height:1.4;color:var(--text-dim);
  text-shadow:0 1px 3px rgba(0,0,0,.9), 0 1px 12px rgba(0,0,0,.8)}
#brand cite{font-style:normal;color:var(--line)}

/* ---------- the panel ---------- */
#panel{top:20px;right:22px;width:280px;max-height:calc(100vh - 112px);
  overflow-y:auto;overscroll-behavior:contain;padding:13px 14px 12px;z-index:6}
#panel::-webkit-scrollbar{width:6px}
#panel::-webkit-scrollbar-thumb{background:var(--rule)}
#findInput{width:100%;padding:7px 9px;background:rgba(255,255,255,.04);
  border:1px solid var(--rule);color:var(--text);font-family:var(--font-s);font-size:12px}
#findInput::placeholder{color:var(--text-faint)}
#findList{list-style:none;margin:2px 0 0;padding:0;background:var(--panel-solid);
  border:1px solid var(--rule);max-height:190px;overflow-y:auto}
#findList:empty{display:none;border:none}
#findList li{padding:6px 9px;font-size:12px;cursor:pointer;color:var(--text-dim)}
#findList li:hover,#findList li.on{background:rgba(200,214,235,.12);color:var(--text)}
#originName{font-family:var(--font-d);font-size:23px;font-weight:500;line-height:1.1;
  margin:11px 0 2px;color:var(--head);text-wrap:balance}
#originCoord{font-family:var(--font-m);font-size:10.5px;color:var(--text-faint);letter-spacing:.02em}

.mode{display:grid;grid-template-columns:24px 1fr;gap:9px;align-items:center;
  width:100%;padding:6px 7px;text-align:left;
  border:1px solid transparent;transition:background .16s,border-color .16s}
.mode+.mode{margin-top:1px}
.mode:hover:not([disabled]){background:rgba(200,214,235,.06)}
.mode[aria-pressed="true"]{background:rgba(200,214,235,.10);border-color:var(--line-dim)}
.mode[disabled]{opacity:.34;cursor:not-allowed}
.mode svg{width:24px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;color:var(--text-dim)}
.mode[aria-pressed="true"] svg{color:var(--line-lit)}
.mode b{display:block;font-weight:500;font-size:12.5px}
.mode[aria-pressed="true"] b{color:var(--head)}
.mode span{display:block;font-size:10px;color:var(--text-faint);line-height:1.3;margin-top:1px}
#modeNote{margin:8px 2px 0;font-size:10.5px;line-height:1.4;color:var(--text-faint)}
#modeNote:empty{display:none}
#paletteWrap{margin:14px 2px 0}
#paletteName{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-faint);margin-bottom:6px}
#palette{display:flex;gap:4px}
#palette button{flex:1;padding:2px;border:1px solid transparent;line-height:0}
#palette button i{display:block;height:13px;border-radius:1px}
#palette button[aria-pressed="true"]{border-color:var(--line-lit)}
#palette button:hover{border-color:var(--line-dim)}

#profile{margin-top:9px;font-size:10.5px;line-height:1.5;color:var(--text-faint);
  border-left:2px solid var(--line-dim);padding-left:9px}
#profile b{color:var(--text-dim);font-weight:500}
#solveNote{margin-top:13px;font-family:var(--font-m);font-size:9.5px;letter-spacing:.03em;
  color:var(--text-faint);border-top:1px solid var(--rule-soft);padding-top:8px}
body.solving #globe{opacity:.55;transition:opacity .2s}
#solving{position:fixed;left:50%;top:50%;z-index:12;transform:translate(-50%,-50%);
  font-family:var(--font-m);font-size:11px;letter-spacing:.14em;color:var(--hot);
  text-transform:uppercase;background:var(--panel-solid);border:1px solid var(--line-dim);
  padding:9px 16px;pointer-events:none;display:none}
body.solving #solving{display:block}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:11px 0 0;
  background:var(--rule-soft);border:1px solid var(--rule-soft)}
.stat{background:var(--ink-2);padding:9px 10px}
.stat .eyebrow{display:block;margin-bottom:3px;font-size:9px}
.stat b{font-family:var(--font-m);font-size:17px;font-weight:500;color:var(--hot);
  letter-spacing:-.01em;font-variant-numeric:tabular-nums;display:block;line-height:1.2}
.stat i{font-style:normal;font-size:10px;color:var(--text-faint);display:block;margin-top:1px}

.sect{margin-top:15px}
.sect>.eyebrow{display:block;margin-bottom:7px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:right;font-weight:600;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-faint);padding:0 0 4px;border-bottom:1px solid var(--rule-soft)}
th:first-child{text-align:left}
td{padding:4.5px 0;border-bottom:1px solid var(--rule-soft);color:var(--text-dim)}
td:first-child{color:var(--text)}
td.num{text-align:right;font-family:var(--font-m);font-variant-numeric:tabular-nums;
  color:var(--hot);font-size:11.5px;white-space:nowrap}

#legend{display:block}
.rampbar{height:11px;border-radius:1px;margin:2px 0 3px}
.ramplab{position:relative;height:13px;margin-bottom:7px}
.ramplab span{position:absolute;transform:translateX(-50%);white-space:nowrap;
  font-family:var(--font-m);font-size:9px;color:var(--text-dim);letter-spacing:.02em}
.ramplab span:last-child{transform:translateX(-100%)}
.lg{display:grid;grid-template-columns:15px 1fr;gap:8px;align-items:center;
  font-family:var(--font-m);font-size:10px;color:var(--text-dim);padding:0.5px 0}
.lg i{display:block;height:8px;border-radius:1px}

details{margin-top:15px;border-top:1px solid var(--rule-soft);padding-top:10px}
#travel{margin-top:13px}
#travelNow{display:grid;grid-template-columns:24px 1fr 12px;gap:9px;align-items:center;
  padding:6px 7px;border:1px solid var(--line-dim);background:rgba(200,214,235,.10);
  font-size:inherit;letter-spacing:normal;text-transform:none;color:inherit}
#travelNow::after{content:"+";color:var(--line);font-size:11px;text-align:right}
#travel[open] #travelNow::after{content:"\2212"}
#travelNow svg{width:24px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;color:var(--line-lit)}
#travelNow b{display:block;font-weight:500;font-size:12.5px;color:var(--head)}
#travelNow i{display:block;font-style:normal;font-size:10px;color:var(--text-faint);
  line-height:1.3;margin-top:1px}
#travel[open] #modeList{margin-top:3px}
summary{cursor:pointer;list-style:none;font-size:9.5px;letter-spacing:.19em;
  text-transform:uppercase;color:var(--text-faint);font-weight:600}
summary::-webkit-details-marker{display:none}
summary::after{content:" +";color:var(--line)}
details[open] summary::after{content:" \2212"}
details p{font-size:11px;line-height:1.55;color:var(--text-faint);margin:9px 0 0}
details h4{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);
  margin:13px 0 0;font-weight:600}
details h4:first-child{margin-top:9px}
details ul{margin:5px 0 0;padding:0;list-style:none}
details li{font-size:11px;line-height:1.45;color:var(--text-faint);margin:0 0 3px 11px;position:relative}
details li::before{content:"";position:absolute;left:-9px;top:6px;width:3px;height:3px;
  background:var(--text-faint);border-radius:50%}
details ul ul{margin:2px 0 4px}
details ul ul li{font-size:10.5px;color:#55607A;margin-left:10px}
details ul ul li::before{background:#55607A;width:2px;height:2px;top:6px}
details b{color:var(--text-dim);font-weight:500}
details a{color:var(--line);text-decoration:none;border-bottom:1px solid var(--line-dim)}
details a:hover{color:var(--line-lit);border-bottom-color:var(--line-lit)}

/* ---------- era axis ---------- */
#timeline{left:22px;right:22px;bottom:20px;padding:12px 34px 10px}
#axis{position:relative;height:48px}
#axis .track{position:absolute;left:0;right:0;top:7px;height:1px;background:var(--rule)}
#axis .brk{position:absolute;top:2px;width:11px;height:11px;transform:translateX(-50%);
  background:var(--ink);pointer-events:none}
#axis .brk::before,#axis .brk::after{content:"";position:absolute;top:0;width:1px;height:11px;
  background:var(--text-faint);transform:rotate(24deg)}
#axis .brk::before{left:3px} #axis .brk::after{left:7px}
#axis .fill{position:absolute;left:0;top:7px;height:1px;background:var(--line);
  transition:width .4s cubic-bezier(.4,0,.2,1)}
.era{position:absolute;top:0;transform:translateX(-50%);text-align:center;white-space:nowrap}
.era .tick{width:1px;height:15px;background:var(--rule);margin:0 auto;transition:background .16s,height .16s}
.era .yr{font-family:var(--font-m);font-size:11.5px;color:var(--text-faint);
  margin-top:5px;transition:color .16s;font-variant-numeric:tabular-nums}
.era .tag{font-size:9px;color:transparent;margin-top:1px;transition:color .16s;letter-spacing:.03em}
.era:hover .yr{color:var(--text-dim)}
.era[aria-pressed="true"] .tick{background:var(--line-lit);height:21px}
.era[aria-pressed="true"] .yr{color:var(--hot)}
.era[aria-pressed="true"] .tag{color:var(--line)}
#timeline .eyebrow{display:block;margin:0 0 6px}

/* ---------- tooltip ---------- */
#tip{
  position:fixed;z-index:9;pointer-events:none;padding:6px 9px;
  background:rgba(6,9,16,.94);border:1px solid var(--rule);
  font-family:var(--font-m);font-size:11px;line-height:1.45;white-space:nowrap;
  transform:translate(-50%,calc(-100% - 13px));
}
#tip b{display:block;font-family:var(--font-s);font-size:12px;font-weight:500;color:#F2F5FA}
#tip span{color:var(--hot)}
#tip em{font-style:normal;color:var(--text-faint)}
#tip.below{transform:translate(-50%,13px)}
#tip.pin{pointer-events:auto}
#tip button{display:block;width:100%;margin-top:8px;padding:8px 10px;
  border:1px solid var(--line-dim);background:rgba(200,214,235,.12);
  font-family:var(--font-s);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:600;color:var(--head)}
#tip button:active{background:rgba(200,214,235,.22)}
#grab{display:none}

/* ---------- boot ---------- */
#boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:var(--ink);transition:opacity .55s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot div{text-align:center}
#boot p{font-family:var(--font-d);font-size:25px;color:var(--text-dim);margin:0 0 12px}
#boot small{font-family:var(--font-m);font-size:11px;color:var(--text-faint);letter-spacing:.06em}

@media (max-width:1140px){
  #panel{width:262px}
  #timeline{padding:12px 26px 9px}
}
/* ================= phones and small tablets =================
   Below 820px the panel becomes a sheet at the foot of the screen. It rests
   at a peek height showing the place, the means of travel and the years, and
   is dragged up for everything else. The era axis moves inside it, so there
   is only ever one thing covering the globe. */
body.mobile{overscroll-behavior:none}
body.mobile #brand{top:calc(11px + env(safe-area-inset-top));left:calc(15px + env(safe-area-inset-left));
  max-width:none}
body.mobile #brand h1{font-size:19px;margin-bottom:0}
body.mobile #brand .rule,body.mobile #brand p{display:none}

body.mobile #panel{
  top:auto;left:0;right:0;bottom:0;width:auto;z-index:8;
  height:86vh; height:86dvh; max-height:none;
  padding:0 15px calc(16px + env(safe-area-inset-bottom));
  border-left:none;border-right:none;border-bottom:none;border-radius:15px 15px 0 0;
  background:rgba(8,12,20,.93);
  display:flex;flex-direction:column;align-items:stretch;
  overflow:hidden;overscroll-behavior:contain;
  transform:translateY(calc(100% - var(--peek,188px)));
  transition:transform .34s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -14px 40px rgba(0,0,0,.55);
}
body.mobile.sheet-open #panel{transform:translateY(0);overflow-y:auto}
body.mobile #panel.dragging{transition:none}

body.mobile #grab{
  display:block;order:0;flex:none;position:sticky;top:0;z-index:2;
  margin:0 -15px;padding:10px 0 8px;touch-action:none;
  background:linear-gradient(rgba(8,12,20,.98) 72%,rgba(8,12,20,0));
}
body.mobile #grab::before{content:"";display:block;width:34px;height:4px;border-radius:2px;
  background:var(--rule-soft);margin:0 auto}
body.mobile.sheet-open #grab::before{background:var(--rule)}

body.mobile #originName{order:1;flex:none;font-size:22px;margin:1px 0 2px;touch-action:none}
body.mobile #originCoord{order:2;flex:none;touch-action:none}
body.mobile #travel{order:3;flex:none;margin-top:11px;border-top:none;padding-top:0}
body.mobile #timeline{order:4;flex:none;position:static;padding:12px 0 0;margin:0;
  background:none;border:none;backdrop-filter:none;-webkit-backdrop-filter:none;width:auto}
body.mobile #findInput{order:5;flex:none;margin-top:16px}
body.mobile #findList{order:6;flex:none}
body.mobile .sect{order:7;flex:none}
body.mobile #paletteWrap{order:8;flex:none}
body.mobile #detail{order:9;flex:none}
body.mobile #panel>details:last-of-type{order:10;flex:none}
body.mobile #solveNote{order:11;flex:none;margin-bottom:4px}

/* the era axis, as a row of chips */
body.mobile #timeline .eyebrow{display:none}
body.mobile #axis{height:auto;display:flex;gap:3px}
body.mobile #axis .track,body.mobile #axis .fill,body.mobile #axis .brk{display:none}
body.mobile .era{position:static;transform:none;flex:1 1 0;min-width:0;padding:9px 0 8px;
  border:1px solid var(--rule-soft);background:rgba(255,255,255,.02)}
body.mobile .era .tick,body.mobile .era .tag{display:none}
body.mobile .era .yr{font-size:11px;margin:0}
body.mobile .era[aria-pressed="true"]{background:rgba(200,214,235,.13);border-color:var(--line-dim)}

/* means of travel: the one in use, opening to a grid of six */
body.mobile #travelNow{padding:10px 11px}
body.mobile #travelNow b{font-size:13.5px}
body.mobile #modeList{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:5px}
body.mobile .mode{grid-template-columns:1fr;justify-items:center;text-align:center;
  gap:5px;padding:11px 4px;border-color:var(--rule-soft);background:rgba(255,255,255,.02)}
body.mobile .mode+.mode{margin-top:0}
body.mobile .mode b{font-size:10.5px;line-height:1.2}
body.mobile .mode [data-v]{display:none}
body.mobile #modeNote{margin-top:7px}

/* everything below the fold gets a little more room for a thumb */
body.mobile summary{padding:4px 0}
body.mobile #findInput,body.mobile #findList li{font-size:16px;padding:10px 11px}
body.mobile #palette button i{height:17px}
body.mobile .stat b{font-size:19px}
body.mobile #tip{max-width:min(78vw,260px);white-space:normal}

@media (max-width:360px){
  body.mobile .era .yr{font-size:10px}
  body.mobile .mode b{font-size:9.5px}
  body.mobile #originName{font-size:19px}
}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>

<div id="stage">
  <canvas id="sky"></canvas>
  <canvas id="globe"></canvas>
</div>

<header id="brand">
  <h1>Isochronic Globe</h1>
  <div class="rule"></div>
  <p title="Francis Galton published the first isochronic map in 1881: bands of colour showing days of travel from London.">How far you could get. After <cite>Galton, 1881</cite>.</p>
</header>


<aside id="panel" class="panel" aria-live="polite">
  <div id="grab" role="button" tabindex="0" aria-label="Expand the panel"></div>
  <input id="findInput" type="text" placeholder="Search a city&hellip;" autocomplete="off"
         spellcheck="false" aria-label="Search a city">
  <ul id="findList"></ul>
  <h2 id="originName">London</h2>
  <div id="originCoord"></div>

  <details id="travel">
    <summary id="travelNow"></summary>
    <div id="modeList"></div>
    <p id="modeNote"></p>
  </details>

  <div class="sect">
    <span class="eyebrow">Scale</span>
    <div id="legend"></div>
  </div>

  <div id="paletteWrap">
    <span id="paletteName"></span>
    <div id="palette" role="group" aria-label="Colour scheme"></div>
  </div>

  <details id="detail">
    <summary>Detail</summary>
    <div id="profile"></div>
    <div class="stats">
      <div class="stat">
        <span class="eyebrow">In a day</span>
        <b id="statDay">&mdash;</b><i id="statDayNote">reach</i>
      </div>
      <div class="stat">
        <span class="eyebrow">In a week</span>
        <b id="statWeek">&mdash;</b><i>of land</i>
      </div>
    </div>
    <div class="sect">
      <span class="eyebrow">Journeys</span>
      <table>
        <thead><tr><th>Destination</th><th id="thEra">Then</th></tr></thead>
        <tbody id="destBody"></tbody>
      </table>
    </div>
  </details>

  <details>
    <summary>Method</summary>
    <div id="method"></div>
  </details>

  <div id="solveNote"></div>
</aside>

<footer id="timeline" class="panel">
  <span class="eyebrow">Year</span>
  <div id="axis">
    <div class="track"></div><div class="fill" id="axisFill"></div>
  </div>
</footer>


<div id="tip" hidden></div>
<div id="solving">Plotting routes</div>

<div id="boot"><div>
  <p>Isochronic Globe</p>
  <small id="bootMsg">building the world&hellip;</small>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="grid.js"></script>
<script src="geo.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
